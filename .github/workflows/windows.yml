name: Windows test installer
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      license_server:
        description: Public HTTPS license service URL (never an admin token)
        default: https://shisan-license.z2596160623.workers.dev
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      XIANYU_LICENSE_SERVER: ${{ inputs.license_server || vars.LICENSE_SERVER || 'https://shisan-license.z2596160623.workers.dev' }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -e . pyinstaller pytest httpx
      - name: Regression tests
        run: python -m pytest -q
      - name: Build interface
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'UI build failed' }
      - name: Generate non-secret distribution defaults
        shell: python
        run: |
          import json, os
          from pathlib import Path
          from urllib.parse import urlsplit
          url = os.environ['XIANYU_LICENSE_SERVER']
          parts = urlsplit(url)
          assert parts.scheme == 'https' and parts.hostname and not parts.username
          Path('src/xianyu_crawler/distribution.json').write_text(json.dumps({'license_server': url}), encoding='utf-8')
      - name: Install installer compiler
        run: choco install innosetup --no-progress -y
      - name: Build and smoke-test installer
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Version '0.2.0'
      - uses: actions/upload-artifact@v4
        with:
          name: Shisan-Windows-Installer
          path: packaging/Output/Shisan-Xianyu-Monitor-Setup-*.exe
          if-no-files-found: error
